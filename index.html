<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F3F5F9">
  <title>InvoicePro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <script defer src="js/auth.js"></script>
  <script defer src="js/script.js"></script>
  <script defer src="js/advanced.js"></script>
</head>
<body><header class="top"><div class="wrap">
  <a class="logo" href="#home"><i aria-hidden="true">₹</i>InvoicePro</a>
  <nav class="nav" id="nav" aria-label="Main">
    <a href="#dashboard" data-r="dashboard">Dashboard</a>
    <a href="#invoices" data-r="invoices">Invoices</a>
    <a href="#clients" data-r="clients">Clients</a>
    <a href="#expenses" data-r="expenses">Expenses</a>
    <a href="#payments" data-r="payments">Payments</a>
    <a href="#recurring" data-r="recurring">Recurring</a>
    <a href="#reports" data-r="reports">Reports</a>
    <a href="#reminders" data-r="reminders">Reminders</a>
    <a href="#data" data-r="data">Data</a>
    <a href="#activity" data-r="activity">Activity</a>
    <a href="#business" data-r="business">Business</a>
  </nav>
  <div class="header-tools">
    <label class="sr-only" for="global-search">Search invoices, clients, and expenses</label>
    <input id="global-search" type="search" placeholder="Search..." autocomplete="off">
    <div id="search-results" class="search-results" hidden></div>
    <a class="btn primary sm" href="#new" id="newbtn">New invoice</a>
    <button class="btn sm" type="button" data-adv="quick-toggle">Quick actions</button>
    <a class="btn sm" href="#notifications" aria-label="Notifications">Notifications <span id="notification-count" class="notification-count" hidden></span></a>
    <button class="btn sm" type="button" data-adv="theme-toggle" aria-label="Toggle dark mode">Dark mode</button>
  </div>
  <div class="account" id="account-menu" aria-label="Signed-in account">
    <span class="profile-icon" aria-hidden="true" id="profile-initial">U</span>
    <span class="account-copy">
      <strong id="profile-name">User</strong>
      <small id="profile-email"></small>
      <small id="profile-business"></small>
    </span>
    <button class="btn sm" type="button" data-auth-logout>Log out</button>
  </div>
</div></header>

<main class="wrap" id="view"></main>
<div id="drawer" hidden></div>
<div id="toast" class="toast" hidden role="status"></div>
</body>
</html>
