<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F3F5F9">
  <title>Create account · InvoicePro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <script defer src="js/auth.js"></script>
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="auth-heading">
      <a class="logo auth-logo" href="login.html"><i aria-hidden="true">₹</i>InvoicePro</a>
      <div class="auth-heading">
        <h1 id="auth-heading">Create Your Account</h1>
        <p>Start managing your invoices with InvoicePro.</p>
      </div>
      <form id="signup-form" class="auth-form" novalidate>
        <div class="auth-message" id="signup-message" role="alert" hidden></div>
        <div class="field">
          <label for="signup-name">Full name</label>
          <input id="signup-name" name="name" type="text" autocomplete="name" placeholder="Your name" required>
        </div>
        <div class="field">
          <label for="signup-business">Business name</label>
          <input id="signup-business" name="business" type="text" autocomplete="organization" placeholder="Your business" required>
        </div>
        <div class="field">
          <label for="signup-email">Email address</label>
          <input id="signup-email" name="email" type="email" autocomplete="email" placeholder="you@company.com" required>
        </div>
        <div class="field">
          <label for="signup-password">Password</label>
          <div class="password-control">
            <input id="signup-password" name="password" type="password" autocomplete="new-password" placeholder="8+ characters, include a letter and number" required>
            <button type="button" class="password-toggle" data-toggle-password="signup-password" aria-label="Show password">Show</button>
          </div>
        </div>
        <div class="field">
          <label for="signup-confirm">Confirm password</label>
          <input id="signup-confirm" name="confirm" type="password" autocomplete="new-password" placeholder="Enter your password again" required>
        </div>
        <label class="check-label terms-label">
          <input type="checkbox" name="terms" id="signup-terms" required>
          <span>I agree to the Terms and Conditions.</span>
        </label>
        <button class="btn primary auth-submit" type="submit">Create Account</button>
      </form>
      <p class="auth-footer">Already have an account? <a href="login.html">Sign In</a></p>
    </section>
    <p class="auth-note">Simple, secure invoice management for your business.</p>
  </main>
</body>
</html>
