<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F3F5F9">
  <title>Choose a new password · InvoicePro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <script defer src="js/auth.js"></script>
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="auth-heading">
      <a class="logo auth-logo" href="login.html"><i aria-hidden="true">₹</i>InvoicePro</a>
      <div class="auth-heading">
        <h1 id="auth-heading">Choose a New Password</h1>
        <p>Enter your email, demo reset code, and a new password.</p>
      </div>
      <form id="reset-form" class="auth-form" novalidate>
        <div class="auth-message" id="reset-message" role="alert" hidden></div>
        <div class="field">
          <label for="reset-email">Email address</label>
          <input id="reset-email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="reset-code">Demo reset code</label>
          <input id="reset-code" name="code" inputmode="numeric" autocomplete="one-time-code" required>
        </div>
        <div class="field">
          <label for="reset-password">New password</label>
          <div class="password-control">
            <input id="reset-password" name="password" type="password" autocomplete="new-password" placeholder="8+ characters, include a letter and number" required>
            <button type="button" class="password-toggle" data-toggle-password="reset-password" aria-label="Show password">Show</button>
          </div>
        </div>
        <div class="field">
          <label for="reset-confirm">Confirm new password</label>
          <input id="reset-confirm" name="confirm" type="password" autocomplete="new-password" required>
        </div>
        <button class="btn primary auth-submit" type="submit">Reset Password</button>
      </form>
      <p class="auth-footer"><a href="login.html">Back to Login</a></p>
      <p class="auth-disclaimer">Demo only. A production reset flow must verify a short-lived, single-use token on a secure backend.</p>
    </section>
  </main>
</body>
</html>
