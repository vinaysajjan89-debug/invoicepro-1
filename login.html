<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F3F5F9">
  <title>Sign in · InvoicePro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <script defer src="js/auth.js"></script>
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="auth-heading">
      <a class="logo auth-logo" href="login.html"><i aria-hidden="true">₹</i>InvoicePro</a>
      <div class="auth-heading">
        <h1 id="auth-heading">Welcome Back</h1>
        <p>Sign in to manage your invoices and business.</p>
      </div>
      <form id="login-form" class="auth-form" novalidate>
        <div class="auth-message" id="login-message" role="alert" hidden></div>
        <div class="field">
          <label for="login-email">Email address</label>
          <input id="login-email" name="email" type="email" autocomplete="email" placeholder="you@company.com" required>
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <div class="password-control">
            <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
            <button type="button" class="password-toggle" data-toggle-password="login-password" aria-label="Show password">Show</button>
          </div>
        </div>
        <div class="auth-options">
          <label class="check-label"><input type="checkbox" name="remember" id="remember-me"> <span>Remember me</span></label>
          <a href="forgot-password.html">Forgot password?</a>
        </div>
        <button class="btn primary auth-submit" type="submit">Sign In</button>
      </form>
      <p class="auth-footer">Don't have an account? <a href="signup.html">Create Account</a></p>
    </section>
    <p class="auth-note">Simple, secure invoice management for your business.</p>
  </main>
</body>
</html>
